# =============================================================================
# fetch-secret — one-shot demo Job
#
# Reuses the swa-probe namespace and ServiceAccount, so this Job authenticates
# with the exact same SPIFFE ID you already validated:
#   spiffe://kind.local/kind-node-group/ns/swa-probe/sa/swa-probe
# That's the identity you register as a workload (host) in Secrets Manager
# when you set up the JWT authenticator (see "Authenticate AI agents with
# JWT SVIDs (SPIFFE)" in the Secrets Manager SaaS docs).
#
# Runs as a Job (not a Deployment) on purpose: it's meant to run once, print
# its result, and exit — ideal for a live demo (`kubectl logs job/...`)
# without a restart loop if something's misconfigured on the Secrets Manager
# side while you're still wiring it up.
#
# Fill in the three REQUIRED env vars below before applying:
#   SECRETS_MGR_SUBDOMAIN      - e.g. "murphyslab" (from murphyslab.secretsmgr.cyberark.cloud)
#   SECRETS_MGR_JWT_SERVICE_ID - the authn-jwt service ID you create, e.g. "spiffe-auth"
#   SECRETS_MGR_PASSWORD_VAR   - the Conjur variable identifier holding the secret,
#                                 e.g. "data/demo/db/password"
# SECRETS_MGR_USERNAME_VAR is optional — set it if you also want a username
# printed alongside the secret (e.g. "data/demo/db/username").
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: fetch-secret
  namespace: swa-probe
  labels:
    app: fetch-secret
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300   # auto-cleanup 5 min after completion; remove if you want logs to persist longer
  template:
    metadata:
      labels:
        app: fetch-secret
    spec:
      serviceAccountName: swa-probe
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fetch-secret
          image: fetch-secret:0.1.0   # <-- kind load docker-image fetch-secret:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SWA_SOCKET_PATH
              value: /tmp/swa-agent/public/api.sock
            - name: SWA_AUDIENCE
              value: conjur
            - name: SWA_WAIT_TIMEOUT
              value: 30s

            # --- REQUIRED: fill these in for your Secrets Manager tenant ---
            - name: SECRETS_MGR_SUBDOMAIN
              value: "murphyslab"              # e.g. murphyslab
            - name: SECRETS_MGR_JWT_SERVICE_ID
              value: "secureWorkloadAccess"              # e.g. spiffe-auth
            - name: SECRETS_MGR_PASSWORD_VAR
              value: "data/vault/m-priv-svc-accts/svc_sca_api/password"              # e.g. data/demo/db/password

            # --- OPTIONAL ---
            - name: SECRETS_MGR_USERNAME_VAR
              value: "data/vault/m-priv-svc-accts/svc_sca_api/username"                       # e.g. data/demo/db/username
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: swa-agent-socket
              mountPath: /tmp/swa-agent
              readOnly: true
      volumes:
        - name: swa-agent-socket
          hostPath:
            path: /tmp/swa-agent
            type: Directory
