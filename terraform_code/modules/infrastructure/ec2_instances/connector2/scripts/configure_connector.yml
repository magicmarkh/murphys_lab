---
- name: Configure CyberArk connector
  hosts: all
  gather_facts: no
  tasks:
    - name: Rename and join domain
      win_shell: |
        $ErrorActionPreference = 'Stop'
        $hostname   = "{{ hostname }}"
        $region     = "{{ region }}"
        $secretArn  = "{{ domain_join_secret_arn }}"
        $domainName = "{{ domain_name }}"
        Rename-Computer -NewName $hostname -Force
        $secretJson = (Get-SECSecretValue -SecretId $secretArn -Region $region).SecretString | ConvertFrom-Json
        $username   = $secretJson.username
        $password   = $secretJson.password | ConvertTo-SecureString -AsPlainText -Force
        $creds      = New-Object System.Management.Automation.PSCredential($username, $password)
        Add-Computer -DomainName $domainName -Credential $creds
    - name: Reboot after domain join
      win_reboot:
        msg: "Rebooting after domain join"
        pre_reboot_delay: 15
        reboot_timeout: 600
    - name: Register connector
      win_shell: |
        C:\\Scripts\\register_connector.ps1
