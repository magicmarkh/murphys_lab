---
# The pod's identity inside Kubernetes. The SWA Agent's k8s-PSAT node
# attestor uses this ServiceAccount (plus the namespace and workload
# selectors registered in the SWA control plane) to decide which SPIFFE
# ID to mint for pods that run as this account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-fetcher
  namespace: swa-demo
