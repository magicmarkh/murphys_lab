---
- name: Remove Windows Computer from Domain
  hosts: all
  gather_facts: no
  connection: winrm
  vars:
    ansible_port: 5985
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore

  tasks:
    - name: Wait for WinRM to be ready
      wait_for_connection:
        timeout: 120
        delay: 5
      register: winrm_check

    - name: Check if WinRM connection succeeded
      fail:
        msg: "Failed to connect to target via WinRM. Instance may already be destroyed."
      when: winrm_check.failed is defined and winrm_check.failed

    - name: Get current computer name before unjoin
      win_shell: $env:COMPUTERNAME
      register: computer_name

    - name: Delete computer object from Active Directory using ADSI (BEFORE unjoining)
      win_shell: |
        $domainUser = "{{ domain_admin_user }}"
        $domainPassword = "{{ domain_admin_password }}"
        $computerName = "{{ computer_name.stdout | trim }}"
        $domainName = "{{ domain_name }}"

        try {
            # Parse domain name to get DC components (e.g., murphyslab.local -> DC=murphyslab,DC=local)
            $dcPath = "DC=" + ($domainName -replace "\.", ",DC=")

            # Create DirectoryEntry with credentials
            $ldapPath = "LDAP://$domainName/$dcPath"
            $directoryEntry = New-Object System.DirectoryServices.DirectoryEntry($ldapPath, $domainUser, $domainPassword)

            # Search for the computer object
            $searcher = New-Object System.DirectoryServices.DirectorySearcher
            $searcher.SearchRoot = $directoryEntry
            $searcher.Filter = "(&(objectClass=computer)(cn=$computerName))"
            $searcher.SearchScope = "Subtree"

            $result = $searcher.FindOne()

            if ($result -ne $null) {
                # Get the computer object's parent container
                $computerObject = $result.GetDirectoryEntry()
                $computerDN = $computerObject.distinguishedName

                # Delete the computer object
                $computerObject.DeleteTree()
                $computerObject.CommitChanges()

                Write-Output "Successfully deleted computer object '$computerName' (DN: $computerDN) from Active Directory"
                exit 0
            }
            else {
                Write-Output "Computer object '$computerName' not found in Active Directory (may have been already deleted)"
                exit 0
            }
        }
        catch {
            Write-Output "ERROR: Failed to delete computer object from AD: $_"
            Write-Output "This will cause issues when recreating the server with the same name."
            exit 1
        }
      register: ad_delete_result
      failed_when: ad_delete_result.rc != 0

    - name: Remove computer from domain (move to workgroup)
      win_domain_membership:
        workgroup_name: WORKGROUP
        domain_admin_user: "{{ domain_admin_user }}"
        domain_admin_password: "{{ domain_admin_password }}"
        state: workgroup
      register: domain_unjoin
      # Continue even if this fails - AD object is already deleted
      ignore_errors: yes

    - name: Display unjoin result
      debug:
        msg: "Domain unjoin {{ 'successful' if not domain_unjoin.failed else 'FAILED (but AD object was deleted)' }}"

    - name: Reboot if required
      win_reboot:
        reboot_timeout: 300
      when: domain_unjoin.reboot_required and not domain_unjoin.failed
