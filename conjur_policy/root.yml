# =============================================================================
# Root Policy
# =============================================================================
# Loaded into branch: root
#   conjur policy load -b root root.yml
#
# Declares:
#   - All human users in the @murphys.cloud domain
#   - Root-level groups (Conjur_Cloud_Admins, Conjur_Cloud_Users, "SE East Majors")
#   - Top-level !policy stubs for the `conjur` and `data` branches.
#     Sub-policies for each branch are loaded separately (see load-policy.sh).
# =============================================================================

# -----------------------------------------------------------------------------
# Human Users
# -----------------------------------------------------------------------------
- !user
  id: brendan.walsh@murphys.cloud

- !user
  id: brett.monk@murphys.cloud

- !user
  id: eric.valli@murphys.cloud

- !user
  id: joshua.clark@murphys.cloud

- !user
  id: mark.hurter@murphys.cloud

