# =============================================================================
# Google Cloud Platform Authenticator
# =============================================================================
# Loaded into branch: conjur
#   conjur policy load -b conjur conjur/authn-gcp.yml
#
# Enables workloads with GCP service-account identity tokens to authenticate
# to Conjur. authn-gcp uses a single global service (no service-id sub-path).
# =============================================================================

- !policy
  id: authn-gcp
  body:
    - !webservice
      annotations:
        description: authn-gcp authenticator endpoint.

    - !webservice
      id: status
      annotations:
        description: Status endpoint for authn-gcp.

    # -------------------------------------------------------------------------
    # Authorization groups
    # -------------------------------------------------------------------------
    - !group
      id: apps
      annotations:
        description: GCP workloads permitted to authenticate.

    - !group
      id: operators
      annotations:
        description: Users permitted to check authenticator status.

    # -------------------------------------------------------------------------
    # Permissions
    # -------------------------------------------------------------------------
    - !permit
      role: !group apps
      privilege: [ authenticate ]
      resource: !webservice

    - !permit
      role: !group operators
      privilege: [ read ]
      resource: !webservice status
