# =============================================================================
# AWS IAM Authenticator
# =============================================================================
# Loaded into branch: conjur
#   conjur policy update -b conjur -f conjur/authn-iam.yml
#
# Enables workloads running with AWS IAM roles to authenticate to Conjur.
# The authenticator must also be enabled in the tenant settings.
# =============================================================================

- !policy
  id: authn-iam
  body:
    - !policy
      id: default
      annotations:
        description: Default service-id for the AWS IAM authenticator.
      body:
        - !webservice
          annotations:
            description: authn-iam/default authenticator endpoint.

        - !webservice
          id: status
          annotations:
            description: Status endpoint for authn-iam/default.

        - !group
          id: apps
          annotations:
            description: AWS IAM workloads permitted to authenticate.

        - !group
          id: operators
          annotations:
            description: Users permitted to check authenticator status.

        - !permit
          role: !group apps
          privilege: [ authenticate ]
          resource: !webservice

        - !permit
          role: !group operators
          privilege: [ read ]
          resource: !webservice status
