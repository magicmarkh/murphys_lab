# =============================================================================
# data/vault/m-conjur-automation - PCloud safe sync
# =============================================================================
# Loaded into branch: data/vault
#   conjur policy load -b data/vault data/vault/m-conjur-automation.yml
#
# Secrets used by Conjur-driven automation: AWS access keys, CyberArk
# Identity service users, JDE automation creds, regional automation creds.
# =============================================================================

- !policy
  id: m-conjur-automation
  body:
    # -------------------------------------------------------------------------
    # Account: Application-M-Identity-Svc-Priv .. svc_mh@murphys.cloud
    # -------------------------------------------------------------------------
    - !policy
      id: Application-M-Identity-Svc-Priv-httpsabv4527.id.cyberark.cloud-svc_mh@murphys.cloud
      body:
        - !variable address
        - !variable KeyID
        - !variable password
        - !variable username

    # -------------------------------------------------------------------------
    # Account: Cloud Service-M-AWS-Access-Keys-AKIAW5PALCL6XTIPUOSJ
    # -------------------------------------------------------------------------
    - !policy
      id: Cloud Service-M-AWS-Access-Keys-AKIAW5PALCL6XTIPUOSJ
      body:
        - !variable AWSAccessKeyID
        - !variable AWSAccountID
        - !variable password
        - !variable Region
        - !variable username

    # -------------------------------------------------------------------------
    # Account: jde-automation-idc
    # -------------------------------------------------------------------------
    - !policy
      id: jde-automation-idc
      body:
        - !variable AWSAccessKeyID
        - !variable AWSAccountID
        - !variable password
        - !variable username

    # -------------------------------------------------------------------------
    # Account: murphys-svc-mh
    # -------------------------------------------------------------------------
    - !policy
      id: murphys-svc-mh
      body:
        - !variable address
        - !variable KeyID
        - !variable password
        - !variable username

    # -------------------------------------------------------------------------
    # Account: us-ent-east-automation
    # -------------------------------------------------------------------------
    - !policy
      id: us-ent-east-automation
      body:
        - !variable AWSAccessKeyID
        - !variable AWSAccountID
        - !variable password
        - !variable Region
        - !variable username

    # -------------------------------------------------------------------------
    # Delegation
    # -------------------------------------------------------------------------
    - !policy
      id: delegation
      body:
        - !group
          id: consumers
          annotations:
            description: Workloads permitted to read m-conjur-automation secrets.

    # Grant Terraform automation host access to this safe's secrets
    - !grant
      role: !group delegation/consumers
      member: !host /data/murphys-tf

    - !permit
      role: !group delegation/consumers
      privileges: [ read, execute ]
      resources:
        - !variable Application-M-Identity-Svc-Priv-httpsabv4527.id.cyberark.cloud-svc_mh@murphys.cloud/address
        - !variable Application-M-Identity-Svc-Priv-httpsabv4527.id.cyberark.cloud-svc_mh@murphys.cloud/KeyID
        - !variable Application-M-Identity-Svc-Priv-httpsabv4527.id.cyberark.cloud-svc_mh@murphys.cloud/password
        - !variable Application-M-Identity-Svc-Priv-httpsabv4527.id.cyberark.cloud-svc_mh@murphys.cloud/username
        - !variable Cloud Service-M-AWS-Access-Keys-AKIAW5PALCL6XTIPUOSJ/AWSAccessKeyID
        - !variable Cloud Service-M-AWS-Access-Keys-AKIAW5PALCL6XTIPUOSJ/AWSAccountID
        - !variable Cloud Service-M-AWS-Access-Keys-AKIAW5PALCL6XTIPUOSJ/password
        - !variable Cloud Service-M-AWS-Access-Keys-AKIAW5PALCL6XTIPUOSJ/Region
        - !variable Cloud Service-M-AWS-Access-Keys-AKIAW5PALCL6XTIPUOSJ/username
        - !variable jde-automation-idc/AWSAccessKeyID
        - !variable jde-automation-idc/AWSAccountID
        - !variable jde-automation-idc/password
        - !variable jde-automation-idc/username
        - !variable murphys-svc-mh/address
        - !variable murphys-svc-mh/KeyID
        - !variable murphys-svc-mh/password
        - !variable murphys-svc-mh/username
        - !variable us-ent-east-automation/AWSAccessKeyID
        - !variable us-ent-east-automation/AWSAccountID
        - !variable us-ent-east-automation/password
        - !variable us-ent-east-automation/Region
        - !variable us-ent-east-automation/username
