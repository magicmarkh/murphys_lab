# =============================================================================
# data/vault - top-level
# =============================================================================
# Loaded into branch: data
#   conjur policy load -b data data/vault/vault.yml
#
# Declares the safe sub-policy stubs and the per-safe admin groups. Each safe's
# variables, delegation policy, and consumers group are loaded by the
# individual safe file (m-aws-keys.yml, m-conjur-automation.yml, etc.).
# =============================================================================

- !policy
  id: vault
  body:
    # -------------------------------------------------------------------------
    # Per-safe admin groups (live under data/vault, not inside each safe)
    # -------------------------------------------------------------------------
    - !group
      id: m-aws-keys-admins
      annotations:
        description: Admins of the m-aws-keys vault safe.

    - !group
      id: m-aws-pem-unmanaged-admins
      annotations:
        description: Admins of the m-aws-pem-unmanaged vault safe.

    - !group
      id: m-conjur-automation-admins
      annotations:
        description: Admins of the m-conjur-automation vault safe.

    - !group
      id: m-priv-svc-accts-admins
      annotations:
        description: Admins of the m-priv-svc-accts vault safe.

    - !group
      id: Trevor-AWS-Test-admins
      annotations:
        description: Admins of the Trevor-AWS-Test vault safe.

    # -------------------------------------------------------------------------
    # Safe sub-policy stubs - bodies loaded per-safe
    # -------------------------------------------------------------------------
    - !policy
      id: m-aws-keys
      owner: !group m-aws-keys-admins
      body: []

    - !policy
      id: m-aws-pem-unmanaged
      owner: !group m-aws-pem-unmanaged-admins
      body: []

    - !policy
      id: m-conjur-automation
      owner: !group m-conjur-automation-admins
      body: []

    - !policy
      id: m-priv-svc-accts
      owner: !group m-priv-svc-accts-admins
      body: []

    - !policy
      id: Trevor-AWS-Test
      owner: !group Trevor-AWS-Test-admins
      body: []
