# =============================================================================
# data/vault/Trevor-AWS-Test - PCloud safe sync
# =============================================================================
# Loaded into branch: data/vault
#   conjur policy load -b data/vault data/vault/Trevor-AWS-Test.yml
#
# Test safe used by Trevor for AWS access-key experimentation.
# =============================================================================

- !policy
  id: Trevor-AWS-Test
  body:
    # -------------------------------------------------------------------------
    # Account: trevorforster55@gmail.com
    # -------------------------------------------------------------------------
    - !policy
      id: Cloud Service-M-AWS-Access-Keys-trevorforster55@gmail.com
      body:
        - !variable AWSAccessKeyID
        - !variable AWSAccountID
        - !variable password
        - !variable username

    # -------------------------------------------------------------------------
    # Delegation
    # -------------------------------------------------------------------------
    - !policy
      id: delegation
      body:
        - !group
          id: consumers
          annotations:
            description: Workloads permitted to read Trevor-AWS-Test secrets.

    - !permit
      role: !group delegation/consumers
      privileges: [ read, execute ]
      resources:
        - !variable Cloud Service-M-AWS-Access-Keys-trevorforster55@gmail.com/AWSAccessKeyID
        - !variable Cloud Service-M-AWS-Access-Keys-trevorforster55@gmail.com/AWSAccountID
        - !variable Cloud Service-M-AWS-Access-Keys-trevorforster55@gmail.com/password
        - !variable Cloud Service-M-AWS-Access-Keys-trevorforster55@gmail.com/username
