# =============================================================================
# data/vault/m-aws-keys - PCloud safe sync
# =============================================================================
# Loaded into branch: data/vault
#   conjur policy load -b data/vault data/vault/m-aws-keys.yml
#
# Mirrors the CyberArk Privilege Cloud safe "m-aws-keys".
# Accounts in the safe are represented as nested policies; each property
# (AWSAccessKeyID, AWSAccountID, password, username) is a !variable.
#
# Consumer access is granted through the data/vault/m-aws-keys/delegation/consumers
# group.
# =============================================================================

- !policy
  id: m-aws-keys
  body:
    # -------------------------------------------------------------------------
    # Account: svc-aws-iam-reconcile
    # -------------------------------------------------------------------------
    - !policy
      id: Cloud Service-M-AWS-Access-Keys-svc-aws-iam-reconcile
      body:
        - !variable AWSAccessKeyID
        - !variable AWSAccountID
        - !variable password
        - !variable username

    # -------------------------------------------------------------------------
    # Delegation - consumer access to all variables in this safe
    # -------------------------------------------------------------------------
    - !policy
      id: delegation
      body:
        - !group
          id: consumers
          annotations:
            description: Workloads permitted to read m-aws-keys secrets.

    - !permit
      role: !group delegation/consumers
      privileges: [ read, execute ]
      resources:
        - !variable Cloud Service-M-AWS-Access-Keys-svc-aws-iam-reconcile/AWSAccessKeyID
        - !variable Cloud Service-M-AWS-Access-Keys-svc-aws-iam-reconcile/AWSAccountID
        - !variable Cloud Service-M-AWS-Access-Keys-svc-aws-iam-reconcile/password
        - !variable Cloud Service-M-AWS-Access-Keys-svc-aws-iam-reconcile/username
