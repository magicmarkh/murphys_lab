# =============================================================================
# data/vault/m-priv-svc-accts - PCloud safe sync
# =============================================================================
# Loaded into branch: data/vault
#   conjur policy load -b data/vault data/vault/m-priv-svc-accts.yml
#
# Privileged service accounts: CyberArk Identity service users, Windows
# domain service accounts, domain joiner, SCA/SIA service accounts,
# Terraform automation account.
# =============================================================================

- !policy
  id: m-priv-svc-accts
  body:
    # -------------------------------------------------------------------------
    # CyberArk Identity service users
    # -------------------------------------------------------------------------
    - !policy
      id: Application-CyberArkIdentityServiceUser-murphyslab.cyberark.cloud-svc_jcc_token@murphys.cloud
      body:
        - !variable address
        - !variable KeyID
        - !variable password
        - !variable username

    - !policy
      id: Application-CyberArkIdentityServiceUser-murphyslab.cyberark.cloud-svc_zsp_lab
      body:
        - !variable address
        - !variable KeyID
        - !variable password
        - !variable username

    # -------------------------------------------------------------------------
    # Domain joiner
    # -------------------------------------------------------------------------
    - !policy
      id: murphys-lab-domain-joiner
      body:
        - !variable address
        - !variable password
        - !variable username

    # -------------------------------------------------------------------------
    # murphys-lab-svc-mh
    # -------------------------------------------------------------------------
    - !policy
      id: murphys-lab-svc-mh
      body:
        - !variable address
        - !variable KeyID
        - !variable password
        - !variable username

    # -------------------------------------------------------------------------
    # Windows domain service accounts
    # -------------------------------------------------------------------------
    - !policy
      id: Operating System-M-Windows-Domain-Service-Priv-murphyslab.local-svc_ccp_example
      body:
        - !variable address
        - !variable password
        - !variable username

    - !policy
      id: Operating System-M-Windows-Domain-Service-Priv-murphyslab.local-svc_mssql
      body:
        - !variable address
        - !variable password
        - !variable username

    # -------------------------------------------------------------------------
    # SCA / SIA / TF automation accounts
    # -------------------------------------------------------------------------
    - !policy
      id: svc_sca_api
      body:
        - !variable address
        - !variable KeyID
        - !variable password
        - !variable username

    - !policy
      id: svc_sia
      body:
        - !variable address
        - !variable password
        - !variable username

    - !policy
      id: svc_tfautomation
      body:
        - !variable address
        - !variable KeyID
        - !variable password
        - !variable username

    # -------------------------------------------------------------------------
    # Delegation
    # -------------------------------------------------------------------------
    - !policy
      id: delegation
      body:
        - !group
          id: consumers
          annotations:
            description: Workloads permitted to read m-priv-svc-accts secrets.

    - !permit
      role: !group delegation/consumers
      privileges: [ read, execute ]
      resources:
        - !variable Application-CyberArkIdentityServiceUser-murphyslab.cyberark.cloud-svc_jcc_token@murphys.cloud/address
        - !variable Application-CyberArkIdentityServiceUser-murphyslab.cyberark.cloud-svc_jcc_token@murphys.cloud/KeyID
        - !variable Application-CyberArkIdentityServiceUser-murphyslab.cyberark.cloud-svc_jcc_token@murphys.cloud/password
        - !variable Application-CyberArkIdentityServiceUser-murphyslab.cyberark.cloud-svc_jcc_token@murphys.cloud/username
        - !variable Application-CyberArkIdentityServiceUser-murphyslab.cyberark.cloud-svc_zsp_lab/address
        - !variable Application-CyberArkIdentityServiceUser-murphyslab.cyberark.cloud-svc_zsp_lab/KeyID
        - !variable Application-CyberArkIdentityServiceUser-murphyslab.cyberark.cloud-svc_zsp_lab/password
        - !variable Application-CyberArkIdentityServiceUser-murphyslab.cyberark.cloud-svc_zsp_lab/username
        - !variable murphys-lab-domain-joiner/address
        - !variable murphys-lab-domain-joiner/password
        - !variable murphys-lab-domain-joiner/username
        - !variable murphys-lab-svc-mh/address
        - !variable murphys-lab-svc-mh/KeyID
        - !variable murphys-lab-svc-mh/password
        - !variable murphys-lab-svc-mh/username
        - !variable Operating System-M-Windows-Domain-Service-Priv-murphyslab.local-svc_ccp_example/address
        - !variable Operating System-M-Windows-Domain-Service-Priv-murphyslab.local-svc_ccp_example/password
        - !variable Operating System-M-Windows-Domain-Service-Priv-murphyslab.local-svc_ccp_example/username
        - !variable Operating System-M-Windows-Domain-Service-Priv-murphyslab.local-svc_mssql/address
        - !variable Operating System-M-Windows-Domain-Service-Priv-murphyslab.local-svc_mssql/password
        - !variable Operating System-M-Windows-Domain-Service-Priv-murphyslab.local-svc_mssql/username
        - !variable svc_sca_api/address
        - !variable svc_sca_api/KeyID
        - !variable svc_sca_api/password
        - !variable svc_sca_api/username
        - !variable svc_sia/address
        - !variable svc_sia/password
        - !variable svc_sia/username
        - !variable svc_tfautomation/address
        - !variable svc_tfautomation/KeyID
        - !variable svc_tfautomation/password
        - !variable svc_tfautomation/username
