# =============================================================================
# data/hosts - Terraform automation hosts
# =============================================================================
# Loaded into branch: data
#   conjur policy update -b data -f data/hosts.yml
#
# Defines hosts used by Terraform automation and their authenticator
# annotations. Each host that uses authn-iam must have an annotation
# mapping it to an AWS IAM role ARN.
# =============================================================================

# -------------------------------------------------------------------------
# Terraform automation host
# -------------------------------------------------------------------------
- !host
  id: murphys-tf
  annotations:
    description: Murphys Lab Terraform automation host identity.
    authn-iam/default: arn:aws:iam::475601244925:role/ec2-tf-automation-role


