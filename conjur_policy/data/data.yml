# =============================================================================
# data branch - top-level
# =============================================================================
# Loaded into branch: root
#   conjur policy load -b root data/data.yml
#
# Declares:
#   - Admin groups under the `data` branch
#   - Hosts that live directly under `data` (loose hosts not in a sub-policy)
#   - Sub-policy stubs for terraform, static, dynamic, swa, vault.
#     The sub-policy contents are loaded separately (see load-policy.sh).
# =============================================================================

- !policy
  id: data
  body:
    # -------------------------------------------------------------------------
    # Admin groups (data root)
    # -------------------------------------------------------------------------
    - !group
      id: Authn_Admins
      annotations:
        description: Admins of authenticator-related data resources.

    - !group
      id: dynamic_admins
      annotations:
        description: Admins of the data/dynamic branch.

    - !group
      id: static_admins
      annotations:
        description: Admins of the data/static branch.

    - !group
      id: swa-admins
      annotations:
        description: Admins of the data/swa branch.

    - !group
      id: vault-admins
      annotations:
        description: Admins of the data/vault branch.

    # -------------------------------------------------------------------------
    # Hosts that live directly under data/
    # -------------------------------------------------------------------------
    - !host
      id: ispss-onboarding
      annotations:
        description: ISPSS onboarding automation host identity.

    - !host
      id: jcc-murphys-tf
      annotations:
        description: JCC Terraform automation host identity.

    - !host
      id: murphys-tf
      annotations:
        description: Murphys Lab general Terraform automation host identity.

    - !host
      id: terraform-aws-integration-tf
      annotations:
        description: Terraform AWS integration host identity.

    - !host
      id: Trevor
      annotations:
        description: Trevor-owned automation host identity.

    # -------------------------------------------------------------------------
    # Sub-policy stubs - bodies loaded by their own policy files
    # -------------------------------------------------------------------------
    - !policy
      id: terraform
      owner: !group Authn_Admins
      body: []

    - !policy
      id: static
      owner: !group static_admins
      body: []

    - !policy
      id: dynamic
      owner: !group dynamic_admins
      body: []

    - !policy
      id: swa
      owner: !group swa-admins
      body: []

    - !policy
      id: vault
      owner: !group vault-admins
      body: []
