# =============================================================================
# data/swa - Secure Workload Access
# =============================================================================
# Loaded into branch: data
#   conjur policy load -b data data/swa.yml
#
# Parent for SWA trust-domain registrations. Each trust domain is added as a
# nested !policy under data/swa/trust-domains.
# =============================================================================

- !policy
  id: swa
  body:
    - !policy
      id: trust-domains
      body:
        - !group
          id: trust-domains-admins
          annotations:
            description: Admins permitted to manage SWA trust domain definitions.
